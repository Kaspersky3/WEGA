version: '3.8'

services:
  # Service PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wega_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - wega-network
    depends_on:
      - db
      - redis

  # Service Nginx
  nginx:
    image: nginx:alpine
    container_name: wega_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - wega-network
    depends_on:
      - app

  # Service MySQL
  db:
    image: mysql:8.0
    container_name: wega_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wega}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${DB_USERNAME:-wega}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wega-network

  # Service Redis (optionnel, pour cache/sessions)
  redis:
    image: redis:alpine
    container_name: wega_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - wega-network

  # Service Node.js pour Vite (développement)
  node:
    image: node:18-alpine
    container_name: wega_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    networks:
      - wega-network
    depends_on:
      - app

networks:
  wega-network:
    driver: bridge

volumes:
  db_data:
    driver: local

